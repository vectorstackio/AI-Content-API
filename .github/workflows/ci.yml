name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
          env:
            OPENAI_API_KEY: ci-placeholder-key
            INGEST_API_KEY: ci-placeholder-key
            PINECONE_API_KEY: ci-placeholder-key
            PINECONE_INDEX_NAME: ci-placeholder-key
            DB_URL: ci-placeholder-key
            API_AUTH_TOKEN: ci-placeholder-key
            API_URL: ci-placeholder-key
